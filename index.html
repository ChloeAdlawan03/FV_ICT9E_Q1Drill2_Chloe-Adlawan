<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; background-color: rgb(255, 248, 240);
        }
        header{
            text-align: center; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; background-color: rgba(120, 63, 36, 0.447); width: 600px; border-radius: 5px; margin: auto;
        }
        h1{
            font-family:Georgia, 'Times New Roman', Times, serif; font-weight: bold;
        }
        section{
             background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 600px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        input[type="text"], select, textarea,  input[type="submit"] {
            width: 96%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        img{
            display: block;
            margin: auto;
            height: 100px;
            width: 100px;
        }
        input[type="submit"]{
            width: 100%; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

    </style>
</head>
<body>
    <header>
        <h1>RATE MOVIES!</h1>
        <p>With this website, you can keep track of all the movies you've watches, and how much you enjoyed them. Rate a movie, write a review, and add it to your list!</p>
    </header>
    <br>

    <section>
        <form action="">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRpdF6Hif8T6Kjj99MVuFQFOADo6pY2QmV1mU2Ns4uCAw&s=10" alt="film strip logo">
            <br>

            <label for="movie">Movie Title</label>
            <br>

            <input type="text" id="movie" name="movie" placeholder="Enter title here...">

            <br>

            <label for="">Genre/s</label>
            <br>
            <input type="checkbox" id="genre1" name="genre">
            <label for="genre1">Action</label>

             <input type="checkbox" id="genre2" name="genre">
            <label for="genre2">Horror</label>

             <input type="checkbox" id="genre3" name="genre">
            <label for="genre3">Romance</label>

             <input type="checkbox" id="genre4" name="genre">
            <label for="genre4">Comedy</label>

             <input type="checkbox" id="genre5" name="genre">
            <label for="genre5">Animated</label>

            <br>
            <label for="rating">Rating</label>
            <br>
            <input type="radio" id="rate1" name="rate">
            <label for="rate1">⭐</label>

            <input type="radio" id="rate2" name="rate">
            <label for="rate2">⭐⭐</label>

            <input type="radio" id="rate3" name="rate">
            <label for="rate3">⭐⭐⭐</label>

            <input type="radio" id="rate4" name="rate">
            <label for="rate4">⭐⭐⭐⭐</label>

            <input type="radio" id="rate5" name="rate">
            <label for="rate5">⭐⭐⭐⭐⭐</label>

            <br>
            <textarea id="review" placeholder="Write your review here..." rows="4" cols="40"></textarea>
            <br>

            <input type="submit" id="submit" value="Submit Your Review!">
            <br>

            Click <a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/" target="_blank">here</a> to find tips in writing your very own movie review.

            <p>Coded by Chloe Adlawan</p>

            <!-- Reference: Nyfa, & Nyfa. (2024, March 23). How to write a movie review: 10 essential tips. NYFA. https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/-->

            
            
        </form>
    </section>
</body>
</html>
